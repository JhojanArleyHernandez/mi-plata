<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#EFF4F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1315" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Plata">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mi Plata</title>
<style>
@font-face{font-family:'Figtree';font-style:normal;font-weight:300 900;font-display:swap;src:url(fonts/figtree-latin-wght.woff2) format('woff2')}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:200 800;font-display:swap;src:url(fonts/bricolage-grotesque-latin-wght.woff2) format('woff2')}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
/* Layout: app móvil con barra inferior; en pantalla ancha, barra lateral. Tarjetas redondeadas, anillos de progreso, un acento teal. */
:root{
  --bg:#EFF4F3; --surface:#FFFFFF; --surface2:#E7EFEE; --ink:#0F1F22; --muted:#587074; --line:#D9E4E3;
  --accent:#0F6B73; --accent-ink:#FFFFFF; --accent-soft:#D3EAEC;
  --good:#237A50; --good-soft:#DAF0E4; --warn:#9A6208; --warn-soft:#FAEBC8; --bad:#B53A33; --bad-soft:#F8DBD8;
  --k1:#1B7F8C; --k2:#DE7A2E; --k3:#6A58D0; --k4:#2F9363; --k5:#C0407A; --k6:#8A7447;
  --shadow:0 1px 2px rgba(15,31,34,.05),0 10px 28px rgba(15,31,34,.07);
  --r:22px; --rs:14px;
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif;
  --fb:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1315; --surface:#122024; --surface2:#1A2D31; --ink:#E7F1F1; --muted:#8CA6AA; --line:#233A3E;
  --accent:#55C6D2; --accent-ink:#04252A; --accent-soft:#12383D;
  --good:#52C78F; --good-soft:#143323; --warn:#E6AC45; --warn-soft:#3A2D12; --bad:#F27B72; --bad-soft:#3C1816;
  --k1:#4DB8C6; --k2:#F29A58; --k3:#9C8DF0; --k4:#58C48C; --k5:#E27AAB; --k6:#C2AA78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1315; --surface:#122024; --surface2:#1A2D31; --ink:#E7F1F1; --muted:#8CA6AA; --line:#233A3E;
  --accent:#55C6D2; --accent-ink:#04252A; --accent-soft:#12383D;
  --good:#52C78F; --good-soft:#143323; --warn:#E6AC45; --warn-soft:#3A2D12; --bad:#F27B72; --bad-soft:#3C1816;
  --k1:#4DB8C6; --k2:#F29A58; --k3:#9C8DF0; --k4:#58C48C; --k5:#E27AAB; --k6:#C2AA78;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--fd);margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.up{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:600;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell */
.shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr)}
.side{display:none}
.main{min-width:0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 132px}
.wrap{max-width:1040px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;gap:12px}
.top h1{font-size:25px;flex:1;min-width:0}
.top .sub{font-size:13px;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:600;border-radius:12px}
.nav button.on{color:var(--accent)}
.nav button.on svg{stroke-width:2.3}
.fab{position:fixed;z-index:55;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border-radius:28px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 10px 26px rgba(15,107,115,.35)}
.fab svg{width:24px;height:24px;stroke-width:2.4}
@media (min-width:900px){
  .shell{grid-template-columns:250px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding:28px 18px;border-right:1px solid var(--line);background:var(--surface)}
  .side .brand{font-family:var(--fd);font-weight:700;font-size:22px;padding:0 12px 18px;display:flex;align-items:center;gap:10px}
  .side button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px;border-radius:14px;font-weight:600;color:var(--muted);text-align:left}
  .side button.on{background:var(--accent-soft);color:var(--accent)}
  .nav{display:none}
  .main{padding-block:0 60px}
  .fab{bottom:28px;right:36px}
}

/* tarjetas y bloques */
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h2{font-size:18px}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card .head a,.link{color:var(--accent);font-weight:600;font-size:13.5px;background:none;border:0;padding:0}
.hero{background:var(--accent);color:var(--accent-ink);box-shadow:0 14px 34px rgba(15,107,115,.28)}
.hero .muted{color:inherit;opacity:.78}
.hero-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero-big{font-size:36px;line-height:1.05}
.minirings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;padding-top:16px;border-top:1px solid color-mix(in srgb,var(--accent-ink) 22%,transparent)}
.mini{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px}
.ring{position:relative;flex:none}
.ring svg{display:block}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.tile{background:var(--surface);border-radius:var(--rs);padding:12px 12px 11px;box-shadow:var(--shadow);min-width:0}
.tile .v{font-size:19px;font-weight:700;font-family:var(--fd);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .l{font-size:11.5px;color:var(--muted);font-weight:600}
.banner{border-radius:var(--r);padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft)} .banner.good{background:var(--good-soft)}
.banner .bi{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--warn);flex:none}
.banner.bad .bi{color:var(--bad)} .banner.good .bi{color:var(--good)}
.banner .bt{flex:1;min-width:180px}
.banner .bt b{font-size:17px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.sec{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:2px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;padding:9px 12px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.bar{height:9px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-width:0}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .amt{font-family:var(--fd);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
button.row{width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;color:#fff}
.dayhead{font-size:12px;font-weight:700;color:var(--muted);padding:12px 0 2px;text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:30px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px;font-family:var(--fd)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font-family:var(--fd);font-size:17px;text-transform:capitalize}
.mnav button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.alert:first-of-type{border-top:0}
.alert .ai{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none}
.alert.warn .ai{background:var(--warn-soft);color:var(--warn)} .alert.bad .ai{background:var(--bad-soft);color:var(--bad)} .alert.ok .ai{background:var(--good-soft);color:var(--good)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span:last-child{font-weight:700;text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .d{aspect-ratio:1;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0;gap:1px}
.cal .d small{font-size:10px;font-weight:600;color:var(--muted)}
.cal .d.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cal .d.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.cal .d.miss{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cal .d.today{box-shadow:0 0 0 2px var(--accent)}
.cal .d.fut{opacity:.5}
.cal .hd{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.chk:first-of-type{border-top:0}
.chk .b{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;color:transparent}
.chk.on .b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk.on .tt{opacity:.55;text-decoration:line-through}
.chk .b svg{width:15px;height:15px;stroke-width:3}

/* formularios y hojas */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(6,16,18,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:8px max(18px,env(safe-area-inset-left,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));animation:up .22s ease-out}
.sheet .grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:6px auto 12px}
.sheet h2{font-size:21px;margin-bottom:12px}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px;max-height:88vh}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld>label,.lab{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:13px;padding:12px 14px;min-height:46px;font-size:16px}
.inp:focus{border-color:var(--accent);outline:none}
.money{font-family:var(--fd);font-size:34px;font-weight:700;border:0;background:transparent;padding:4px 0;width:100%;letter-spacing:-.02em}
.money:focus{outline:none}
.moneybox{display:flex;align-items:center;gap:6px;border-bottom:2px solid var(--line);margin-bottom:16px;padding-bottom:4px}
.moneybox:focus-within{border-color:var(--accent)}
.moneybox span{font-family:var(--fd);font-size:30px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:700;background:var(--surface2);color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.callout{border-radius:var(--rs);padding:12px 14px;background:var(--warn-soft);font-size:13.5px;margin-bottom:14px}
.callout.info{background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--bg);border-radius:14px;padding:11px 18px;font-weight:600;font-size:14px;max-width:90vw;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad);color:#fff}
@media (min-width:900px){.toast{bottom:40px}}
.sk{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--fb)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
textarea.inp{min-height:84px;resize:vertical}
.shell.bare{grid-template-columns:minmax(0,1fr)}
.shell.bare .side{display:none}
.welcome{max-width:560px;margin:40px auto 0;text-align:center}
.welcome h1{font-size:34px;margin:14px 0 8px}
.welcome ul{text-align:left;margin:18px 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.welcome li{display:flex;gap:12px;align-items:flex-start}
</style>
</head>

<script>
'use strict';
/* ====================== almacenamiento local (solo en este dispositivo) ====================== */

(function(){
 const KEY='miplata:v1',clone=o=>JSON.parse(JSON.stringify(o));
 let docs={},ok=true;
 try{localStorage.setItem(KEY+':t','1');localStorage.removeItem(KEY+':t')}catch(e){ok=false}
 const load=()=>{try{const r=localStorage.getItem(KEY);docs=r?(JSON.parse(r)||{}):{}}catch(e){docs={}}};
 if(ok)load();
 const subs=[];
 const colOf=p=>p.split('/').slice(0,-1).join('/');
 const snapDoc=p=>{const d=docs[p];return {id:p.split('/').pop(),exists:d!==undefined,data:()=>d===undefined?undefined:clone(d),metadata:{fromCache:false,hasPendingWrites:false}}};
 const snapCol=c=>{const ds=Object.keys(docs).filter(k=>colOf(k)===c).sort().map(snapDoc);return {docs:ds,size:ds.length,empty:!ds.length,docChanges:()=>[],metadata:{}}};
 const fire=s=>setTimeout(()=>{try{s.cb(s.type==='doc'?snapDoc(s.path):snapCol(s.path))}catch(e){console.error(e)}},0);
 const notify=p=>subs.forEach(s=>{if((s.type==='doc'&&s.path===p)||(s.type==='col'&&s.path===colOf(p)))fire(s)});
 const notifyAll=()=>subs.forEach(fire);
 const persist=()=>{localStorage.setItem(KEY,JSON.stringify(docs))};
 const listen=(type,path,cb)=>{const s={type,path,cb};subs.push(s);fire(s);return()=>{const i=subs.indexOf(s);if(i>=0)subs.splice(i,1)}};
 const db={
  doc:p=>({id:p.split('/').pop(),path:p,
   get:async()=>snapDoc(p),
   set:async d=>{const prev=docs[p];docs[p]=clone(d);try{persist()}catch(e){if(prev===undefined)delete docs[p];else docs[p]=prev;throw e}notify(p)},
   update:async d=>{const prev=docs[p];docs[p]={...(prev||{}),...clone(d)};try{persist()}catch(e){if(prev===undefined)delete docs[p];else docs[p]=prev;throw e}notify(p)},
   delete:async()=>{const prev=docs[p];delete docs[p];try{persist()}catch(e){if(prev!==undefined)docs[p]=prev;throw e}notify(p)},
   onSnapshot:cb=>listen('doc',p,cb)}),
  collection:c=>({path:c,onSnapshot:cb=>listen('col',c,cb)})
 };
 window.addEventListener('storage',e=>{if(e.key===KEY){load();notifyAll()}});
 window.MP_LOCAL={ok,dump:()=>clone(docs),count:()=>Object.keys(docs).length,restore:o=>{const prev=docs;docs=clone(o);try{persist()}catch(e){docs=prev;throw e}notifyAll()}};
 window.claude={use:async n=>n==='db'&&ok?db:null};
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
})();

'use strict';
/* ====================== utilidades ====================== */

const weekStart=s=>{const d=parseD(s);return addDays(s,-((d.getDay()+6)%7))};
const money=n=>{n=Math.round(n||0);return (n<0?'−':'')+'$'+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.')};
const digits=v=>parseInt(String(v==null?'':v).replace(/\D/g,''),10)||0;
const dec=v=>{const n=parseFloat(String(v).replace(',','.').replace(/[^\d.]/g,''));return isNaN(n)?0:n};
const sum=(a,f)=>a.reduce((x,y)=>x+(typeof f==='function'?f(y):f?y[f]:y),0);

/* ====================== configuración por defecto ====================== */
const TIPOS={Esencial:'--k1',Personal:'--k2',Deuda:'--k3',Imprevisto:'--k5',Cargo:'--k6'};
const DEFAULT_CATS=[

 {id:'mercado',n:'Mercado',t:'Esencial',b:null},
 {id:'agua',n:'Agua',t:'Esencial',b:null},
 {id:'internet_hogar',n:'Internet hogar',t:'Esencial',b:null},
 {id:'internet_movil',n:'Internet móvil',t:'Esencial',b:null},
 {id:'comida',n:'Comida fuera y pan',t:'Personal',b:null},
 {id:'ropa',n:'Ropa',t:'Personal',b:null},
 {id:'otros',n:'Otros y salidas',t:'Personal',b:'resto'},
 {id:'suscripciones',n:'Suscripciones',t:'Personal',b:null},
 {id:'tarjeta_pago',n:'Pago de tarjeta',t:'Deuda',b:'plan'},
 {id:'imprevistos',n:'Imprevistos',t:'Imprevisto',b:'cfg'},
 {id:'comisiones',n:'Comisiones bancarias',t:'Cargo',b:0},
 {id:'intereses',n:'Intereses y cargos de tarjeta',t:'Cargo',b:0}
];
const DEFAULT_CFG={
 nombre:'',ingresoMes:0,pagosMes:2,dia1:15,dia2:30,esenciales:0,fijos:0,
 pagoTarjeta:0,ahorroMes:0,imprevistos:0,cupo:0,saldoInicial:0,tasaEA:28.59,manejo:0,
 saldoRef:null,ahorroInicial:0,diasColchon:15,umbralInusual:80000,umbralCupo:80,umbralGasto:90,metaDep:85,
 sobreSemanal:0,inicio:'2026-01-01',cats:DEFAULT_CATS
};
const MEDIOS=[{id:'efectivo',n:'Efectivo'},{id:'debito',n:'Débito'},{id:'tarjeta',n:'Tarjeta de crédito'},{id:'transf',n:'Transferencia'}];
const DISPARADORES=['Hambre','Cansancio','Estrés','Aburrimiento','Premio','Presión social','Ninguno'];
const FUENTES=['Empleo principal','Diseño freelance','Apps y mantenimiento','Productos digitales','Otro'];
const FREQS=[{m:1,n:'Cada mes'},{m:2,n:'Cada 2 meses'},{m:3,n:'Cada 3 meses'},{m:6,n:'Cada 6 meses'},{m:12,n:'Cada año'}];
const freqName=m=>(FREQS.find(f=>f.m===m)||{n:'Cada '+m+' meses'}).n;

/* ====================== estado ====================== */
const S={cfg:null,gastos:{},ingresos:{},recibos:{},ahorro:{},metas:{},deseos:{},subs:{},hab:{d30:{},d21:{},sem:{}},meta:null,loaded:{},db:null,timeout:false};
const UI={tab:'inicio',seg:{dinero:'gastos',metas:'metas',habitos:'espera'},mes:null,fcat:null,sim:null,open21:null};
const L=c=>Object.values(S[c]);
const cats=()=>S.cfg.cats;
const catOf=id=>cats().find(c=>c.id===id);
const tipoOf=id=>(catOf(id)||{t:'Personal'}).t;
const medioN=id=>(MEDIOS.find(m=>m.id===id)||{n:id}).n;

/* ====================== cálculos ====================== */
function D(){
 const c=S.cfg;
 return {personal:c.ingresoMes-c.esenciales-c.pagoTarjeta-c.ahorroMes-c.imprevistos,
  quincena:c.ingresoMes/c.pagosMes,colchon:c.esenciales/30*c.diasColchon,fondo3:c.esenciales*3,fondo6:c.esenciales*6,
  tm:Math.pow(1+c.tasaEA/100,1/12)-1,margen:c.ingresoMes-c.esenciales};
}
function cardSchedule(c,pagoQ,saldo0,start){
 const tm=Math.pow(1+c.tasaEA/100,1/12)-1,h=Math.pow(1+tm,.5)-1,rows=[],m0=start.slice(0,7);let s=saldo0;
 for(let k=0;k<24;k++){
  const m=ymAdd(m0,Math.floor(k/2)),dia=k%2===0?c.dia1:c.dia2,f=m+'-'+pad(Math.min(dia,daysIn(m)));
  const int=s*h,pago=Math.min(pagoQ,s+int),fin=s+int-pago;
  rows.push({k,m,f,ini:s,int,pago,fin,libre:pagoQ-pago});s=fin<0.5?0:fin;
 }
 return rows;
}
const planRows=()=>cardSchedule(S.cfg,S.cfg.pagoTarjeta/2,S.cfg.saldoInicial,S.cfg.inicio);
function simulate(saldo,pagoQ,desde){
 const c=S.cfg,tm=Math.pow(1+c.tasaEA/100,1/12)-1,h=Math.pow(1+tm,.5)-1,rows=[];let s=saldo,tot=0,f=desde;
 if(saldo<=0)return {rows,meses:0,int:0,fecha:desde,ok:true};
 if(pagoQ<=s*h)return {rows,meses:null,int:null,fecha:null,ok:false};
 for(let k=0;k<240&&s>0.5;k++){
  const int=s*h,pago=Math.min(pagoQ,s+int);s=s+int-pago;tot+=int;rows.push({f,fin:s,int});f=nextPayDay(addDays(f,1));
 }
 return {rows,meses:rows.length/2,int:tot,fecha:rows.length?rows[rows.length-1].f:desde,ok:true};
}
function nextPayDay(from){
 const c=S.cfg,m=ymOf(from);
 for(let i=0;i<3;i++){const mm=ymAdd(m,i);for(const d of [c.dia1,c.dia2]){const f=mm+'-'+pad(Math.min(d,daysIn(mm)));if(f>=from)return f;}}
 return from;
}
function saldoTarjeta(){
 const c=S.cfg;let s=c.saldoInicial,from='0000-00-00';
 if(c.saldoRef){s=c.saldoRef.v;from=c.saldoRef.f}
 for(const g of L('gastos')){if(g.f<=from)continue;if(g.p==='tarjeta')s+=g.m;if(g.c==='tarjeta_pago')s-=g.m}
 return s;
}
function planMes(ym){
 const c=S.cfg,d=D(),first=ymOf(c.inicio),k=ym<first?first:ym,r=planRows().filter(x=>x.m===k);
 return {Esencial:c.esenciales,Personal:d.personal,Deuda:r.length?sum(r,'pago'):0,Ahorro:c.ahorroMes+(r.length?sum(r,'libre'):c.pagoTarjeta),Imprevisto:c.imprevistos,Cargo:0};
}
function reciboProv(catId){return sum(L('recibos').filter(r=>r.cat===catId&&r.monto>0),r=>r.monto/r.cada)}
function catBudget(cat,ym){
 const c=S.cfg,d=D();
 if(cat.t==='Deuda')return planMes(ym).Deuda;
 if(cat.b==='cfg')return c.imprevistos;
 if(cat.b==='fijos')return c.fijos;
 if(cat.b==='resto'){const o=sum(cats().filter(x=>x.t==='Personal'&&x.id!==cat.id&&typeof x.b==='number'),'b');return Math.max(0,d.personal-o)}
 const p=reciboProv(cat.id);if(p>0)return p;
 return typeof cat.b==='number'?cat.b:0;
}
function agg(ym){
 const g=L('gastos').filter(x=>ymOf(x.f)===ym),byTipo={},byCat={};
 let caja=0,cred=0,compCred=0,nCred=0,inus=0,cargos=0;
 for(const x of g){
  const t=tipoOf(x.c);byTipo[t]=(byTipo[t]||0)+x.m;byCat[x.c]=(byCat[x.c]||0)+x.m;
  if(x.p==='tarjeta'){cred+=x.m;if(t!=='Cargo'){compCred+=x.m;nCred++}}else caja+=x.m;
  if(t!=='Esencial'&&t!=='Deuda'&&x.m>=S.cfg.umbralInusual)inus++;
  if(t==='Cargo'||x.c==='suscripciones')cargos+=x.m;
 }
 let ing=0,ingLC=0;
 for(const i of L('ingresos'))for(const p of (i.pagos||[]))if(ymOf(p.f)===ym){ing+=p.m;if(i.fuente==='Empleo principal')ingLC+=p.m}
 let ahoCaja=0,ahoFondo=0;
 for(const a of L('ahorro'))if(ymOf(a.f)===ym){const v=a.tipo==='retiro'?-a.m:a.m;ahoCaja+=v;if(!a.meta)ahoFondo+=v}
 return {g,byTipo,byCat,caja,cred,compCred,nCred,inus,cargos,ing,ingLC,ahoCaja,ahoFondo,quede:ing-caja-ahoCaja};
}
function ahorroTotal(metaId){
 return (metaId?0:S.cfg.ahorroInicial)+sum(L('ahorro').filter(a=>(a.meta||null)===(metaId||null)),a=>a.tipo==='retiro'?-a.m:a.m);
}
function pagado(i){return sum(i.pagos||[],'m')}
function pendientes(){
 const t=today();
 return L('ingresos').map(i=>({i,pend:i.mEsp-pagado(i),esp:i.esp,dias:diffDays(t,i.esp)})).filter(x=>x.pend>0).sort((a,b)=>a.esp<b.esp?-1:1);
}
function deben(){return pendientes().filter(x=>x.dias>=0)}
function reciboInfo(r){
 const t=today();let est='sin-fecha',dias=null,apartado=0,falta=0,porQ=0;
 const prov=r.monto>0?r.monto/r.cada:0;
 if(r.prox){
  dias=diffDays(r.prox,t);est=dias<0?'vencido':dias<=7?'pronto':'ok';
  const ini=addMonths(r.prox,-r.cada),tot=diffDays(r.prox,ini)||1,fr=clamp(diffDays(t,ini)/tot,0,1);
  apartado=(r.monto||0)*fr;falta=Math.max(0,(r.monto||0)-apartado);porQ=falta/Math.max(1,Math.ceil(Math.max(dias,0)/15));
 }
 return {prov,est,dias,apartado,falta,porQ};
}
function dependencia(ym){const a=agg(ym);return a.ing>0?a.ingLC/a.ing:null}
function semanaGasto(){
 const t=today(),w=weekStart(t),e=addDays(w,6);
 return sum(L('gastos').filter(g=>g.c==='comida'&&g.f>=w&&g.f<=e),'m');
}
function alerts(ym){
 const c=S.cfg,d=D(),A=agg(ym),P=planMes(ym),out=[],t=today();
 const late=pendientes().filter(x=>x.dias>0);
 out.push(late.length?{k:'pago',e:'bad',t:'Pago de quincena atrasado',x:`${late.length} pago(s) sin recibir por ${money(sum(late,'pend'))}. El más atrasado lleva ${Math.max(...late.map(x=>x.dias))} días. Activa el protocolo de pago tardío.`}:{k:'pago',e:'ok',t:'Pagos al día',x:'No hay pagos esperados sin recibir.'});
 const aho=ahorroTotal(null);
 out.push(aho>=d.colchon?{k:'col',e:'ok',t:'Colchón completo',x:`Tienes ${money(aho)} y cubres ${dcm((aho/(c.esenciales/30)).toFixed(1))} días de esenciales.`}:{k:'col',e:'warn',t:`Colchón de ${c.diasColchon} días en construcción`,x:`Tienes ${money(aho)} de ${money(d.colchon)} (${Math.round(100*aho/d.colchon)}%).`});
 const pr=A.byTipo.Personal||0,pp=P.Personal;
 out.push(pp>0&&pr>=pp?{k:'per',e:'bad',t:'Gasto personal pasado',x:`Llevas ${money(pr)} de ${money(pp)} este mes.`}:pp>0&&pr>=pp*c.umbralGasto/100?{k:'per',e:'warn',t:'Gasto personal cerca del límite',x:`Llevas ${money(pr)} de ${money(pp)} (${Math.round(100*pr/pp)}%).`}:{k:'per',e:'ok',t:'Gasto personal en rango',x:`Llevas ${money(pr)} de ${money(pp)}.`});
 out.push(A.compCred>0?{k:'cre',e:'warn',t:'Compras con tarjeta de crédito',x:`${A.nCred} compra(s) por ${money(A.compCred)} suman a la deuda. Aplica la regla de espera.`}:{k:'cre',e:'ok',t:'Sin compras con crédito',x:'Ninguna compra con tarjeta este mes.'});
 const sal=saldoTarjeta(),uso=c.cupo>0?sal/c.cupo:0;
 out.push(uso>=c.umbralCupo/100?{k:'cup',e:uso>=.95?'bad':'warn',t:'Cupo de la tarjeta casi lleno',x:`Usas el ${Math.round(uso*100)}% del cupo (${money(sal)} de ${money(c.cupo)}). Disponible ${money(Math.max(0,c.cupo-sal))}.`}:{k:'cup',e:'ok',t:'Cupo con espacio',x:`Usas el ${Math.round(uso*100)}% del cupo.`});
 out.push(A.inus>0?{k:'inu',e:'warn',t:'Gastos inusuales',x:`${A.inus} gasto(s) de ${money(c.umbralInusual)} o más. Confirma que los decidiste.`}:{k:'inu',e:'ok',t:'Sin gastos inusuales',x:`Ningún gasto personal desde ${money(c.umbralInusual)}.`});
 const prev=agg(ymAdd(ym,-1)).cargos;
 out.push(A.cargos>0&&A.cargos>prev?{k:'car',e:'warn',t:'Comisiones e intereses subieron',x:`Este mes ${money(A.cargos)} frente a ${money(prev)} del mes anterior.`}:{k:'car',e:'ok',t:'Comisiones bajo control',x:A.cargos?`${money(A.cargos)} este mes, sin subir.`:'Sin comisiones, intereses ni suscripciones registrados.'});
 const rv=L('recibos').map(r=>({r,...reciboInfo(r)})).filter(x=>x.est==='vencido'||x.est==='pronto');
 out.push(rv.length?{k:'rec',e:rv.some(x=>x.est==='vencido')?'bad':'warn',t:'Recibos por pagar',x:rv.map(x=>`${x.r.nombre} (${x.dias<0?'vencido hace '+(-x.dias)+' d':x.dias===0?'vence hoy':'vence en '+x.dias+' d'})`).join(', ')+'.'}:{k:'rec',e:'ok',t:'Recibos al día',x:'Ningún recibo vence en los próximos 7 días.'});
 if(A.quede<0)out.push(deben().length?{k:'que',e:'warn',t:'Gastaste antes de cobrar',x:`Este mes salieron ${money(A.caja)} y entraron ${money(A.ing)}. Te deben ${money(sum(deben(),'pend'))}.`}:{k:'que',e:'bad',t:'Déficit del mes',x:`Ingresos ${money(A.ing)} − salidas ${money(A.caja)} − ahorro ${money(A.ahoCaja)} = ${money(A.quede)}.`});
 return out;
}

const bar=(p,c)=>`<div class="bar"><i style="width:${clamp((p||0)*100,0,100)}%;background:${(p||0)>1.0001?'var(--bad)':(c||'var(--accent)')}"></i></div>`;

function barsChart(labels,a,b,la,lb){
 const W=320,H=150,pb=22,pt=8,n=labels.length,gw=(W-16)/n,bw=Math.min(16,gw/2-3),max=Math.max(1,...a,...b);
 let s='';
 for(let g=0;g<=2;g++){const y=pt+(H-pb-pt)*g/2;s+=`<line x1="8" x2="${W-8}" y1="${y}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/>`}
 labels.forEach((l,i)=>{
  const x0=8+i*gw+gw/2,ha=(H-pb-pt)*a[i]/max,hb=(H-pb-pt)*b[i]/max;
  s+=`<rect x="${x0-bw-1}" y="${H-pb-ha}" width="${bw}" height="${Math.max(ha,0)}" rx="4" style="fill:var(--k1)"/><rect x="${x0+1}" y="${H-pb-hb}" width="${bw}" height="${Math.max(hb,0)}" rx="4" style="fill:var(--k2)"/><text x="${x0}" y="${H-6}" text-anchor="middle">${l}</text>`;
 });
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${la} y ${lb} por mes">${s}</svg><div class="legend"><span><i style="background:var(--k1)"></i>${la}</span><span><i style="background:var(--k2)"></i>${lb}</span></div>`;
}
function lineChart(series,labels){
 const W=320,H=150,pl=8,pb=22,pt=10,n=Math.max(...series.map(s=>s.v.length)),max=Math.max(1,...series.flatMap(s=>s.v));
 const X=i=>pl+(W-pl*2)*i/Math.max(1,n-1),Y=v=>pt+(H-pb-pt)*(1-v/max);
 let s='';
 for(let g=0;g<=2;g++){const y=pt+(H-pb-pt)*g/2;s+=`<line x1="${pl}" x2="${W-pl}" y1="${y}" y2="${y}" style="stroke:var(--line)"/>`}
 series.forEach(se=>{
  const d=se.v.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  s+=`<path d="${d}" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" ${se.dash?'stroke-dasharray="5 4"':''} style="stroke:${se.c}"/>`;
  const li=se.v.length-1;s+=`<circle cx="${X(li)}" cy="${Y(se.v[li])}" r="3.5" style="fill:${se.c}"/>`;
 });
 labels.forEach((l,i)=>{s+=`<text x="${X(l[0])}" y="${H-6}" text-anchor="middle">${l[1]}</text>`});
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Proyección del saldo">${s}</svg><div class="legend">${series.map(se=>`<span><i style="background:${se.c}"></i>${se.n}</span>`).join('')}</div>`;
}

function etaAhorro(actual,meta){

 let acc=actual,m=ymOf(today());
 for(let i=0;i<120;i++){acc+=planMes(m).Ahorro;if(acc>=meta)return 'Según el plan: '+ymLabel(m);m=ymAdd(m,1)}
 return 'Más de 10 años al ritmo del plan';
}

const ACT={};
let FORM={};
const $$=(s,el)=>[...(el||document).querySelectorAll(s)];
const fmtN=n=>Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const num=id=>digits(val(id));
const two=(a,b)=>`<div class="two">${a}${b}</div>`;
const fld=(label,id,inner)=>`<div class="fld">${id?`<label for="${id}">${label}</label>`:`<div class="lab">${label}</div>`}${inner}</div>`;
const bigMoney=(id,v)=>`<div class="moneybox"><span>$</span><input class="money" id="${id}" inputmode="numeric" autocomplete="off" value="${v?fmtN(v):''}" placeholder="0" aria-label="Monto"></div>`;
const moneyInp=(id,v,ph)=>`<input class="inp" id="${id}" data-money inputmode="numeric" autocomplete="off" value="${v?fmtN(v):''}" placeholder="${ph||'0'}">`;
const dateInp=(id,v)=>`<input class="inp" type="date" id="${id}" value="${v||''}">`;
const textInp=(id,v,ph)=>`<input class="inp" id="${id}" value="${esc(v||'')}" placeholder="${esc(ph||'')}" autocomplete="off">`;
const chipsHTML=(g,items,cur)=>`<div class="chips" data-grp="${g}">${items.map(([v,n])=>`<button type="button" class="chip ${cur===v?'on':''}" data-act="pick" data-g="${g}" data-v="${esc(v)}">${esc(n)}</button>`).join('')}</div>`;
const footHTML=(label,canDel)=>`<div id="ferr" class="small" role="alert" style="color:var(--bad);min-height:20px;margin-bottom:6px"></div><div style="display:flex;gap:10px">${canDel?`<button type="button" class="btn danger" data-act="sdel" aria-label="Eliminar">${ic('trash')}</button>`:''}<button type="button" class="btn block" data-act="ssubmit">${label||'Guardar'}</button></div>`;
const ferr=m=>{const e=$('#ferr');if(e)e.textContent=m||''};

function openSheet(title,body,focus){
 $('#layer').innerHTML=`<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="grab"></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><h2 style="margin:0">${esc(title)}</h2><button type="button" class="iconbtn" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>${body}</div></div>`;
 document.body.style.overflow='hidden';
 if(focus){const e=$(focus);if(e)setTimeout(()=>{try{e.focus({preventScroll:true})}catch(_){}},60)}
}
function closeSheet(){$('#layer').innerHTML='';FORM={};document.body.style.overflow=''}

ACT.close=()=>closeSheet();
ACT.scrim=(el,e)=>{if(e.target===el)closeSheet()};
ACT.pick=el=>{const g=el.dataset.g,v=el.dataset.v;FORM[g]=v;$$(`[data-grp="${g}"] .chip`).forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(FORM.onPick)FORM.onPick(g,v)};
ACT.ssubmit=()=>{if(FORM.submit)FORM.submit()};
ACT.sdel=el=>{
 if(!FORM.del)return;
 if(!FORM._armed){FORM._armed=true;const old=el.innerHTML;el.textContent='¿Seguro? Toca otra vez';setTimeout(()=>{FORM._armed=false;if(el.isConnected)el.innerHTML=old},4000);return}
 FORM.del();
};
ACT.fchk=el=>{const k=el.dataset.k;FORM[k]=!FORM[k];el.classList.toggle('on',!!FORM[k])};

 FORM={c:b.c,p:b.p,d:b.d||'Ninguno',pl:b.pl===false?'no':'si',deseo:pre&&pre.deseo||null};

 };
 FORM.onPick('c');FORM.onPick('p');

  toast(cred?'Anotado. Suma '+money(m)+' a la deuda de la tarjeta.':'Gasto anotado: '+money(m));
 };
 FORM.del=async()=>{closeSheet();await Store.remove('gastos',id);toast('Gasto eliminado')};
}

/* ---------- cobrar (registrar pago recibido) ---------- */
function sheetCobrar(){
 const t=today(),pend=pendientes();
 if(!pend.length){toast('No hay pagos pendientes por recibir.');return}
 FORM={sel:{},manual:false};pend.forEach(x=>{if(x.dias>=0)FORM.sel[x.i.id]=true});
 if(!Object.keys(FORM.sel).length)FORM.sel[pend[0].i.id]=true;
 const tot=()=>sum(pend.filter(x=>FORM.sel[x.i.id]),'pend');
 const list=pend.map(x=>`<button type="button" class="chk ${FORM.sel[x.i.id]?'on':''}" data-act="cobChk" data-id="${x.i.id}"><span class="b">${ic('check')}</span><span style="flex:1"><span class="tt" style="display:block;font-weight:600">${esc(x.i.concepto)}</span><span class="small muted">${x.dias>0?'Atrasada '+x.dias+' días':x.dias===0?'Toca hoy':'Esperada el '+fdate(x.i.esp)}${pagado(x.i)>0?' · ya recibiste '+money(pagado(x.i)):''}</span></span><b class="num">${money(x.pend)}</b></button>`).join('');
 const body=`<div class="small muted" style="margin-bottom:6px">Marca las quincenas que te pagaron. Si te pagaron un valor distinto, cámbialo abajo.</div><div style="margin-bottom:14px">${list}</div><div class="lab" style="margin-bottom:2px">Monto que recibiste</div>${bigMoney('f-m',tot())}${fld('Fecha en que lo recibiste','f-f',dateInp('f-f',t))}${footHTML('Registrar pago')}`;
 openSheet('Registrar pago recibido',body);
 FORM.onInput=e=>{if(e.target.id==='f-m')FORM.manual=true};
 ACT.cobChk=el=>{const id=el.dataset.id;FORM.sel[id]=!FORM.sel[id];el.classList.toggle('on',!!FORM.sel[id]);if(!FORM.manual){const m=$('#f-m');if(m){const v=tot();m.value=v?fmtN(v):''}}};
 FORM.submit=async()=>{
  let rest=num('f-m');if(!rest)return ferr('Escribe cuánto te pagaron.');
  const f=val('f-f')||t,sel=pend.filter(x=>FORM.sel[x.i.id]);
  if(!sel.length)return ferr('Marca al menos una quincena.');
  const total=rest;closeSheet();
  for(let k=0;k<sel.length;k++){
   const x=sel[k];let take=k===sel.length-1?rest:Math.min(rest,x.pend);
   if(take<=0)continue;rest-=take;
   await Store.save('ingresos',x.i.id,{...x.i,pagos:[...(x.i.pagos||[]),{f,m:take}]});
  }
  toast('Registrado: '+money(total));
  sheetReparto(total);
 };
}
function sheetReparto(monto){
 const c=S.cfg,t=today(),A=agg(ymOf(t));
 const rv=L('recibos').map(r=>({r,...reciboInfo(r)})).filter(x=>(x.est==='vencido'||x.est==='pronto')&&x.r.monto>0);
 const rvT=sum(rv,x=>x.r.monto),tj=Math.round(c.pagoTarjeta/2+A.compCred),ah=Math.round(c.ahorroMes/2);
 const resto=monto-rvT-tj-ah;
 const row=(l,v,s)=>`<div class="kv"><span>${l}${s?`<div class="tiny muted">${s}</div>`:''}</span><span>${money(v)}</span></div>`;
 openSheet('¿Qué hago con este pago?',`<div class="small muted" style="margin-bottom:8px">Sugerencia en este orden, sobre los ${money(monto)} que recibiste. Ajusta según lo que debas esta semana.</div>
 ${row('1. Recibos vencidos o por vencer',rvT,rv.length?rv.map(x=>x.r.nombre).join(', '):'Ninguno con monto cargado')}
 ${row('2. Tarjeta',tj,'Abono del plan'+(A.compCred>0?' + '+money(A.compCred)+' que compraste con tarjeta este mes':''))}
 ${row('3. Colchón',ah,'Págate primero')}
 ${row('4. Para esenciales y gasto personal',Math.max(0,resto),'Mercado, transporte y el sobre de la semana')}
 ${resto<0?`<div class="callout" style="margin-top:12px">No alcanza para todo. Prioriza: recibos vencidos, esenciales, abono mínimo a la tarjeta y deja el colchón para la próxima quincena.</div>`:''}
 <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button type="button" class="btn sec" style="flex:1" data-act="abono">Abonar a la tarjeta</button><button type="button" class="btn" style="flex:1" data-act="close">Listo</button></div>`);
}

function sheetAjustes(){
 const c=S.cfg;FORM={};
 const inp=([k,l,ty])=>{const id='a-'+k;return `<div class="fld"><label for="${id}">${l}</label>${ty==='money'?moneyInp(id,c[k]):ty==='date'?dateInp(id,c[k]):`<input class="inp" id="${id}" ${ty==='text'?'':'inputmode="decimal"'} value="${esc(ty==='dec'?dcm(c[k]):c[k])}">`}</div>`};
 const edit=cats().filter(x=>x.t!=='Deuda'&&(typeof x.b==='number'||x.b===null));
 const catsHTML=edit.map(x=>{const rp=reciboProv(x.id)>0;return `<div class="fld"><label for="ac-${x.id}">${esc(x.n)}${rp?' (desde tus recibos)':''}</label>${rp?`<input class="inp" disabled value="${fmtN(reciboProv(x.id))} al mes">`:moneyInp('ac-'+x.id,x.b||0)}</div>`}).join('');
 const th=(()=>{try{return localStorage.getItem('miplata-theme')||'auto'}catch(e){return 'auto'}})();
 FORM.theme=th;
 const body=`<div class="callout info">Cambia aquí tus números cuando cambie tu situación. Todo se recalcula.</div>
 ${AJ.slice(0,8).map(inp).join('')}
 <h3 style="margin:8px 0 10px">Tarjeta</h3>${AJ.slice(8,12).map(inp).join('')}
 <h3 style="margin:8px 0 10px">Presupuesto por categoría</h3><div class="small muted" style="margin-bottom:10px">Lo que esperas gastar al mes. Mercado, comida y ropa no tienen recibo, así que los defines aquí.</div>${catsHTML}
 <h3 style="margin:8px 0 10px">Otros</h3>${AJ.slice(12).map(inp).join('')}
 ${fld('Tema','',chipsHTML('theme',[['auto','Automático'],['light','Claro'],['dark','Oscuro']],th))}
 ${window.EXTRA_AJ?window.EXTRA_AJ():''}
 ${footHTML('Guardar ajustes')}
 <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)"><button type="button" class="btn sec" data-act="addq">Agregar quincenas de los próximos 3 meses</button><button type="button" class="btn danger" data-act="reset">Borrar todos mis datos</button></div>`;
 openSheet('Ajustes',body);
 FORM.onPick=(k,v)=>{if(k==='theme')applyTheme(v)};
 FORM.submit=async()=>{
  const patch={};
  for(const [k,,ty] of AJ){const v=val('a-'+k);patch[k]=ty==='money'?digits(v):ty==='int'?(digits(v)||c[k]):ty==='dec'?(dec(v)||c[k]):ty==='date'?(v||c[k]):(v.trim()||c[k])}
  if(patch.fijos>patch.esenciales)return ferr('Los fijos no pueden ser mayores que los esenciales.');
  if(patch.dia1<1||patch.dia1>31||patch.dia2<1||patch.dia2>31)return ferr('Los días de quincena van de 1 a 31.');
  if(patch.tasaEA>=100)return ferr('Revisa la tasa: debe ser un porcentaje anual, como 28,59.');
  patch.cats=cats().map(x=>edit.includes(x)&&!(reciboProv(x.id)>0)?{...x,b:(digits(val('ac-'+x.id))||(x.b===null?null:0))}:x);
  try{localStorage.setItem('miplata-theme',FORM.theme||'auto')}catch(e){}
  closeSheet();await Store.saveCfg(patch);toast('Ajustes guardados');
 };

 <h3 style="margin:6px 0 10px">Tarjeta de crédito (opcional)</h3>
 ${two(fld('Cupo','s-cupo',moneyInp('s-cupo',0)),fld('Saldo que debes hoy','s-saldo',moneyInp('s-saldo',0)))}
 ${two(fld('Tasa % efectivo anual','s-tasa',`<input class="inp" id="s-tasa" inputmode="decimal" value="28,59">`),fld('Abono por mes','s-abono',moneyInp('s-abono',0)))}
 <div class="small muted" style="margin:-6px 0 14px">La tasa está en el extracto de tu tarjeta. 28,59 es solo un valor de referencia.</div>
 <h3 style="margin:6px 0 10px">Ahorro</h3>
 ${two(fld('Ahorro al mes','s-aho',moneyInp('s-aho',0)),fld('Imprevistos al mes','s-imp',moneyInp('s-imp',0)))}
 ${fld('¿Te deben quincenas? Primer mes pendiente (opcional)','s-desde','<input class="inp" type="month" id="s-desde">')}
 <div class="small muted" style="margin:-6px 0 14px">Las quincenas de ese mes en adelante quedan como pendientes de cobro. Si alguna ya la recibiste, bórrala en Dinero, Ingresos.</div>
 ${footHTML('Crear mi plan')}`;
 openSheet('Configura tu plan',body,'#s-ing');
 FORM.submit=async()=>{
  const ing=num('s-ing'),ess=num('s-ess'),fij=num('s-fij'),aho=num('s-aho'),imp=num('s-imp'),abono=num('s-abono'),cupo=num('s-cupo'),saldo=num('s-saldo');
  const a=clamp(digits(val('s-d1'))||15,1,31),b=clamp(digits(val('s-d2'))||30,1,31),tasa=dec(val('s-tasa'))||28.59,nombre=val('s-nombre').trim(),desde=val('s-desde');
  if(!ing)return ferr('Escribe tu ingreso mensual.');
  if(!ess)return ferr('Escribe cuánto gastas al mes en esenciales.');
  if(fij>ess)return ferr('Los fijos no pueden ser mayores que los esenciales.');
  if(tasa>=100)return ferr('Revisa la tasa: debe ser un porcentaje anual, como 28,59.');
  const personal=ing-ess-abono-aho-imp;
  if(personal<0)return ferr('Lo que reservas supera tu ingreso por '+money(-personal)+'. Baja alguno de los montos.');
  const comida=Math.round(personal*0.5/1000)*1000,ropa=Math.round(personal*0.25/1000)*1000;
  const cfg={...clean(DEFAULT_CFG),nombre,ingresoMes:ing,dia1:Math.min(a,b),dia2:Math.max(a,b),esenciales:ess,fijos:fij,pagoTarjeta:abono,ahorroMes:aho,imprevistos:imp,cupo,saldoInicial:saldo,tasaEA:tasa,sobreSemanal:Math.round(comida/4/1000)*1000,inicio:t};
  cfg.cats=cfg.cats.map(x=>x.id==='comida'?{...x,b:comida}:x.id==='ropa'?{...x,b:ropa}:x);
  const cur=ymOf(t),conDeuda=/^\d{4}-\d{2}$/.test(desde)&&desde<=cur,m0=conDeuda?desde:cur,q=Math.round(ing/2),ings=[];
  for(let m=m0;m<=ymAdd(cur,3);m=ymAdd(m,1))for(const [j,d] of [[1,cfg.dia1],[2,cfg.dia2]]){
   const f=m+'-'+pad(Math.min(d,daysIn(m)));
   if(!conDeuda&&f<t)continue;
   ings.push(['q'+m.replace('-','')+'-'+j,{esp:f,mEsp:q,fuente:'Empleo principal',concepto:'Quincena '+j+' de '+MESL[+m.slice(5,7)-1],pagos:[],sup:true}]);
  }
  closeSheet();
  S.cfg=cfg;S.hab={d30:{},d21:{},sem:{},inicio30:t,inicio21:t};S.meta={ready:true,v:1};
  try{if(S.db){await S.db.doc('cfg/main').set(clean(cfg));await S.db.doc('hab/main').set(clean(S.hab));await S.db.doc('meta/app').set(S.meta)}}catch(e){toast('No se pudo guardar. Revisa el espacio del dispositivo.','bad')}
  render();
  for(const [id,rec] of ings)await Store.save('ingresos',id,rec);
  await Store.save('metas','colchon',{tipo:'colchon',nombre:'Colchón de pago tardío'});
  if(saldo>0)await Store.save('metas','tarjeta',{tipo:'tarjeta',nombre:'Tarjeta en cero'});
  await Store.save('metas','fondo3',{tipo:'fondo3',nombre:'Fondo de 3 meses de esenciales'});
  await Store.save('metas','fondo6',{tipo:'fondo6',nombre:'Fondo de 6 meses de esenciales'});
  toast('Plan creado. Agrega tus recibos en la pestaña Recibos.');
 };
}

/* ====================== arranque, render y eventos ====================== */
const NAV=[['inicio','Inicio','home'],['dinero','Dinero','wallet'],['recibos','Recibos','receipt'],['metas','Metas','target'],['habitos','Hábitos','habit']];
const KEYS=['cfg','hab','meta','gastos','ingresos','recibos','ahorro','metas','deseos','subs'];
let BOOTING=true,rt=null,toastT=null;
const allLoaded=()=>KEYS.every(k=>S.loaded[k]);
const normHab=h=>({d30:{},d21:{},sem:{},...h});

function toast(msg,kind){
 const el=$('#toast');if(!el)return;
 el.textContent=msg;el.className='toast'+(kind==='bad'?' bad':'');el.hidden=false;
 clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},3400);
}

function loadingHTML(){return `<div class="stack" style="padding-top:24px"><div class="sk" style="height:56px"></div><div class="sk" style="height:220px"></div><div class="sk"></div><div class="sk"></div></div>`}
function welcomeHTML(){
 const stuck=S.db&&!allLoaded();
 if(stuck)return `<div class="welcome"><span class="ico" style="background:var(--warn);width:64px;height:64px;border-radius:22px;margin:0 auto">${ic('clock')}</span><h1>No alcanzo tus datos todavía</h1><p class="muted">Tardó más de lo normal en responder el almacenamiento. Sigo esperando: si ya usabas la app, tus datos aparecerán solos. No cargues el plan otra vez para no duplicarlo.</p><button class="btn ghost block" data-act="sinGuardar">Usar sin guardar por ahora</button></div>`;
 return welcomeMain();
}
const NOSAVE=()=>window.MP_STANDALONE?'Este navegador no está guardando datos (¿ventana privada?): se borrarán al cerrar.':'Esta vista no guarda datos: se borrarán al cerrarla.';

function render(){
 const app=$('#app');if(!app)return;
 if(!UI.mes)UI.mes=ymOf(today());
 const shell=$('#shell'),nav=$('#nav'),side=$('#side'),fab=$('#fab');
 const ready=!!S.cfg&&(S.db?(allLoaded()||S.timeout):true);
 shell.classList.toggle('bare',!ready);nav.style.display=ready?'':'none';fab.style.display=ready?'':'none';
 const y=window.scrollY;
 if(!ready){
  side.innerHTML='';
  app.innerHTML=(BOOTING||(S.db&&!allLoaded()&&!S.timeout))?loadingHTML():welcomeHTML();
  return;
 }
 const tabBtn=(cls)=>NAV.map(([k,n,i])=>`<button class="${UI.tab===k?'on':''}" data-act="tab" data-t="${k}" ${UI.tab===k?'aria-current="page"':''}>${ic(i)}<span>${n}</span></button>`).join('');
 nav.innerHTML=tabBtn();
 side.innerHTML=`<div class="brand"><span class="ico" style="background:var(--accent);width:36px;height:36px;border-radius:12px">${ic('wallet')}</span>Mi Plata</div>`+tabBtn()+`<div style="flex:1"></div><button data-act="ajustes">${ic('gear')}<span>Ajustes</span></button>`;
 const v=({inicio:vInicio,dinero:vDinero,recibos:vRecibos,metas:vMetas,habitos:vHabitos})[UI.tab]||vInicio;
 let html=v();
 if(!S.db)html=html.replace('<div class="stack">','<div class="stack"><div class="callout" style="margin:8px 0 0">'+NOSAVE()+'</div>');
 if(S.timeout&&!allLoaded())html=html.replace('<div class="stack">','<div class="stack"><div class="callout" style="margin:8px 0 0">Algunos datos no han llegado todavía. Lo que ves puede estar incompleto o desactualizado.</div>');
 app.innerHTML=html;
 window.scrollTo(0,y);
}
function scheduleRender(){
 clearTimeout(rt);
 rt=setTimeout(function tick(){
  const a=document.activeElement;
  if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#app').contains(a)){rt=setTimeout(tick,500);return}
  render();
 },60);
}
async function persistHab(){if(S.db){try{await S.db.doc('hab/main').set(clean(S.hab))}catch(e){toast('No se pudo guardar. Revisa tu conexión.','bad')}}}

/* ---------- navegación ---------- */
const toTop=()=>window.scrollTo(0,0);
ACT.tab=el=>{UI.tab=el.dataset.t;render();toTop()};
ACT.goto=el=>{UI.tab=el.dataset.tab;if(el.dataset.seg)UI.seg[UI.tab]=el.dataset.seg;render();toTop()};
ACT.seg=el=>{UI.seg[el.dataset.k]=el.dataset.v;render()};
ACT.mes=el=>{UI.mes=ymAdd(UI.mes,+el.dataset.d);UI.fcat=null;render()};
ACT.fcat=el=>{UI.fcat=el.dataset.v||null;render()};
ACT.sim=el=>{UI.sim=Math.max(10000,(UI.sim||S.cfg.pagoTarjeta/2)+ +el.dataset.d);render()};
ACT.sinGuardar=()=>{S.db=null;KEYS.forEach(k=>S.loaded[k]=true);render()};

/* ---------- hábitos ---------- */
ACT.d21open=el=>{const n=+el.dataset.n;UI.open21=UI.open21===n?null:n;render()};
ACT.d21chk=el=>{const n=el.dataset.n,cur=S.hab.d21[n]||{};S.hab.d21={...S.hab.d21,[n]:{...cur,hecho:!cur.hecho}};Store.saveHab()};
ACT.semchk=el=>{
 const w=weekStart(today()),cur=S.hab.sem[w]||{t:[],ok:'',aj:''},t=[...(cur.t||[])];
 while(t.length<WEEK_TASKS.length)t.push(false);
 const i=+el.dataset.i;t[i]=!t[i];
 S.hab.sem={...S.hab.sem,[w]:{...cur,t}};Store.saveHab();
};

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('change',e=>{
 const t=e.target,k=t.dataset&&t.dataset.chg;if(!k)return;
 const n=t.dataset.n;
 if(k==='d21t'||k==='d21m'){S.hab.d21={...S.hab.d21,[n]:{...(S.hab.d21[n]||{}),[k==='d21t'?'t':'m']:t.value}};persistHab()}
 if(k==='semok'||k==='semaj'){const w=weekStart(today()),cur=S.hab.sem[w]||{t:[],ok:'',aj:''};S.hab.sem={...S.hab.sem,[w]:{...cur,[k==='semok'?'ok':'aj']:t.value}};persistHab()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.matches&&t.matches('input.money,input[data-money]')){const n=digits(t.value);t.value=n?fmtN(n):''}
 if(FORM.onInput)FORM.onInput(e);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#layer').firstChild){closeSheet();return}
 if(e.key==='Enter'&&e.target.matches&&e.target.matches('.sheet input.inp,.sheet input.money')&&FORM.submit){e.preventDefault();FORM.submit()}
});

/* ---------- datos en vivo ---------- */
function subscribe(){
 const db=S.db;
 const done=k=>{S.loaded[k]=true;if(allLoaded())clearTimeout(S.timer)};
 const errH=k=>e=>{S.loaded[k]=true;if(e&&e.code==='revoked')S.db=null;scheduleRender()};
 for(const c of ['gastos','ingresos','recibos','ahorro','metas','deseos','subs']){
  db.collection(c).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{o[d.id]={...clean(d.data()),id:d.id}});S[c]=o;done(c);scheduleRender()},errH(c));
 }
 db.doc('cfg/main').onSnapshot(s=>{S.cfg=s.exists?{...clean(DEFAULT_CFG),...clean(s.data())}:null;done('cfg');scheduleRender()},errH('cfg'));
 db.doc('hab/main').onSnapshot(s=>{S.hab=s.exists?normHab(clean(s.data())):normHab({});done('hab');scheduleRender()},errH('hab'));
 db.doc('meta/app').onSnapshot(s=>{S.meta=s.exists?clean(s.data()):null;done('meta');scheduleRender()},errH('meta'));
 S.timer=setTimeout(()=>{if(!allLoaded()){S.timeout=true;scheduleRender()}},10000);
}
(async function boot(){
 try{const th=localStorage.getItem('miplata-theme');if(th)applyTheme(th)}catch(e){}
 const t=$('#toast');if(t)t.setAttribute('role','status');
 render();
 await Store.init();
 BOOTING=false;
 if(S.db)subscribe();else KEYS.forEach(k=>S.loaded[k]=true);
 render();
})();

/* ====================== copia de seguridad (solo versión instalable) ====================== */
const LASTB='miplata:lastBackup';
const lastBackup=()=>{try{return +localStorage.getItem(LASTB)||0}catch(e){return 0}};
window.EXTRA_AJ=()=>{const l=lastBackup();return `<h3 style="margin:8px 0 6px">Copia de seguridad</h3><div class="small muted" style="margin-bottom:10px">Tus datos viven solo en este dispositivo. Guarda una copia de vez en cuando (envíatela por WhatsApp o guárdala en Archivos). Última copia: ${l?fdate(iso(new Date(l))):'nunca'}.</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px"><button type="button" class="btn sec" style="flex:1" data-act="export">Guardar copia</button><button type="button" class="btn ghost" style="flex:1" data-act="import">Restaurar copia</button></div><input type="file" id="f-file" accept=".json,application/json" hidden>`};
window.EXTRA_INICIO=()=>{
 const n=Object.keys(S.gastos).length+Object.keys(S.ahorro).length,l=lastBackup();
 if(n<5||(l&&Date.now()-l<21*864e5))return '';
 return `<div class="callout info" style="margin:0"><b>Guarda una copia de seguridad.</b> Tus datos viven solo en este dispositivo. <button class="link" data-act="export">Guardar copia ahora</button></div>`;
};
ACT.export=async()=>{
 const obj={app:'mi-plata',v:1,fecha:new Date().toISOString(),docs:MP_LOCAL.dump()};
 const name='mi-plata-copia-'+today()+'.json',blob=new Blob([JSON.stringify(obj)],{type:'application/json'}),file=new File([blob],name,{type:'application/json'});
 try{
  if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:'Copia de Mi Plata'});
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
  try{localStorage.setItem(LASTB,String(Date.now()))}catch(e){}
  toast('Copia guardada');scheduleRender();
 }catch(e){if(!e||e.name!=='AbortError')toast('No se pudo guardar la copia.','bad')}
};
ACT.import=()=>{const f=$('#f-file');if(f){f.value='';f.click()}};
document.addEventListener('change',async e=>{
 const f=e.target;if(!f||f.id!=='f-file'||!f.files||!f.files[0])return;
 let obj;try{obj=JSON.parse(await f.files[0].text())}catch(_){return toast('Ese archivo no es una copia de Mi Plata.','bad')}
 if(!obj||obj.app!=='mi-plata'||!obj.docs||typeof obj.docs!=='object')return toast('Ese archivo no es una copia de Mi Plata.','bad');
 sheetRestaurar(obj);
});
function sheetRestaurar(obj){
 const n=Object.keys(obj.docs).length,f=obj.fecha?fdate(iso(new Date(obj.fecha))):'fecha desconocida';
 FORM={};
 openSheet('Restaurar copia',`<div class="callout">Esta copia (${f}) trae ${n} registros. Al restaurarla se reemplaza todo lo que tienes ahora en este dispositivo.</div>${footHTML('Restaurar y reemplazar')}`);
 FORM.submit=()=>{try{MP_LOCAL.restore(obj.docs);closeSheet();toast('Copia restaurada')}catch(e){ferr('No se pudo restaurar: falta espacio en el dispositivo.')}};
}

</script>
